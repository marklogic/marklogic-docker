# Compose scenario: Two separate 2-node clusters with secrets for cross-cluster coupling tests.
version: '3.6'
services:
    # === CLUSTER 1 ===
    cluster1_bootstrap:
      image: progressofficial/marklogic-db
      container_name: cluster1_bootstrap
      hostname: cluster1_bootstrap
      dns_search: ""
      environment:
        - MARKLOGIC_INIT=true
        - MARKLOGIC_ADMIN_USERNAME_FILE=mldb_admin_username
        - MARKLOGIC_ADMIN_PASSWORD_FILE=mldb_admin_password
        - TZ=Europe/Prague
      volumes:
        - MarkLogic_cluster1_vol1:/var/opt/MarkLogic
      secrets:
          - mldb_admin_password
          - mldb_admin_username
      ports:
        - 7100-7110:8000-8010
        - 7197:7997
      networks:
      - external_net
    
    cluster1_node2:
      image: progressofficial/marklogic-db
      container_name: cluster1_node2
      hostname: cluster1_node2
      dns_search: ""
      environment:
        - MARKLOGIC_INIT=true
        - MARKLOGIC_ADMIN_USERNAME_FILE=mldb_admin_username
        - MARKLOGIC_ADMIN_PASSWORD_FILE=mldb_admin_password
        - MARKLOGIC_JOIN_CLUSTER=true
        - MARKLOGIC_BOOTSTRAP_HOST=cluster1_bootstrap
        - TZ=Europe/Prague
      volumes:
        - MarkLogic_cluster1_vol2:/var/opt/MarkLogic
      secrets:
        - mldb_admin_password
        - mldb_admin_username
      ports:
        - 7200-7210:8000-8010
        - 7297:7997
      depends_on:
      - cluster1_bootstrap
      networks:
      - external_net

    # === CLUSTER 2 ===
    cluster2_bootstrap:
      image: progressofficial/marklogic-db
      container_name: cluster2_bootstrap
      hostname: cluster2_bootstrap
      dns_search: ""
      environment:
        - MARKLOGIC_INIT=true
        - MARKLOGIC_ADMIN_USERNAME_FILE=mldb_admin_username
        - MARKLOGIC_ADMIN_PASSWORD_FILE=mldb_admin_password
        - TZ=Europe/Prague
      volumes:
        - MarkLogic_cluster2_vol1:/var/opt/MarkLogic
      secrets:
          - mldb_admin_password
          - mldb_admin_username
      ports:
        - 7300-7310:8000-8010
        - 7397:7997
      networks:
      - external_net
    
    cluster2_node2:
      image: progressofficial/marklogic-db
      container_name: cluster2_node2
      hostname: cluster2_node2
      dns_search: ""
      environment:
        - MARKLOGIC_INIT=true
        - MARKLOGIC_ADMIN_USERNAME_FILE=mldb_admin_username
        - MARKLOGIC_ADMIN_PASSWORD_FILE=mldb_admin_password
        - MARKLOGIC_JOIN_CLUSTER=true
        - MARKLOGIC_BOOTSTRAP_HOST=cluster2_bootstrap
        - TZ=Europe/Prague
      volumes:
        - MarkLogic_cluster2_vol2:/var/opt/MarkLogic
      secrets:
        - mldb_admin_password
        - mldb_admin_username
      ports:
        - 7400-7410:8000-8010
        - 7497:7997
      depends_on:
      - cluster2_bootstrap
      networks:
      - external_net

secrets:
  mldb_admin_password:
    file: ./mldb_admin_password.txt
  mldb_admin_username:
    file: ./mldb_admin_username.txt
networks:
  external_net: {}
volumes:
  MarkLogic_cluster1_vol1:
  MarkLogic_cluster1_vol2:
  MarkLogic_cluster2_vol1:
  MarkLogic_cluster2_vol2:
